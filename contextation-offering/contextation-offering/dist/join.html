<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf8fb">
  <title>A place · Offering</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/map.css">
  <script type="module" src="/join.js"></script>
</head>
<body class="join-page">
  <a class="skip-link" href="#main">Skip to the invitation</a>
  <main id="main" class="participant">
    <div id="connection-error" class="connection-error" role="status" hidden><span id="connection-message"></span> <button id="retry-connection" class="text-button" type="button">Try again</button></div>
    <section id="loading-view" class="quiet-view" aria-live="polite"><p>One moment.</p></section>
    <section id="entry-view" hidden aria-labelledby="place-title">
      <h1 id="place-title">Choose a place.</h1>
      <p id="round-note" class="muted">Somewhere in or near Syracuse.</p>
      <label for="display-name">Your name <span class="optional">(optional)</span></label>
      <input id="display-name" type="text" maxlength="40" autocomplete="given-name" placeholder="Leave blank to stay anonymous">
      <div class="mode-switch" role="group" aria-label="Choose how to find a place"><button id="search-mode" type="button" aria-pressed="true" aria-controls="search-pane">Search</button><button id="map-mode" type="button" aria-pressed="false" aria-controls="map-pane">Map</button></div>
      <section id="search-pane" aria-label="Search for a place">
        <form id="search-form" role="search"><label id="search-label" for="place-search" class="sr-only">Find a local place</label><div class="search-row"><input id="place-search" type="search" autocomplete="off" maxlength="120" placeholder="Place name or address"><button id="search-button" type="submit">Search</button></div></form>
        <p id="search-status" class="caption" role="status" aria-live="polite"></p>
        <ul id="search-results" class="search-results" aria-label="Matching places"></ul>
      </section>
      <section id="map-pane" aria-label="Choose a map point" hidden><div id="selection-map" class="selection-map"></div><p id="map-caption" class="caption" role="status">Choose a point.</p></section>
      <label id="home-option" class="check-row"><input id="private-home" type="checkbox"><span>This is a home or private address.</span></label>
      <section id="review" class="review" hidden aria-label="Review your place">
        <div class="chosen-row"><p id="chosen-summary" class="chosen-place" tabindex="-1"></p><button id="rename-place" class="text-button" type="button" aria-expanded="false" aria-controls="label-editor">Rename</button></div>
        <div id="label-editor" hidden><label for="place-label">Label on the map</label><input id="place-label" type="text" maxlength="120"></div>
        <p id="share-details" class="caption"></p>
        <label class="check-row consent-row"><input id="share-consent" type="checkbox"><span>I’m okay sharing this place and name with the room.</span></label>
        <div class="form-actions"><button id="submit-place" class="primary" type="button">Submit</button><button id="cancel-edit" class="text-button" type="button" hidden>Keep my place</button></div>
      </section>
      <p id="submit-status" class="error" role="alert"></p>
    </section>
    <section id="quiet-view" class="quiet-view" hidden aria-labelledby="quiet-title"><h1 id="quiet-title">Your place is held.</h1><p id="quiet-place" class="muted"></p><p id="quiet-copy">Look up when you’re ready.</p><button id="edit-place" class="text-button" type="button" hidden>Edit my place</button></section>
    <noscript><p>This shared offering needs JavaScript. You can also tell the presenter a place to add for you.</p></noscript>
  </main>
</body>
</html>
